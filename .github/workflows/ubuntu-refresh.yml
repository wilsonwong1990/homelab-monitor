name: Ubuntu point release refresh
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
  push:
    branches: ["ubuntu-validation/**"]
permissions:
  contents: read
concurrency:
  group: ubuntu-refresh-${{ github.ref }}
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      needed: ${{ steps.discover.outputs.needed }}
      version: ${{ steps.discover.outputs.version }}
      sha256: ${{ steps.discover.outputs.sha256 }}
      tag: ${{ steps.discover.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Discover newest authenticated point release and skip completed builds
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          bash image/ubuntu-manifest.sh build/upstream
          flags=()
          [[ "$REF" == refs/heads/main ]] || flags=(--validation)
          # Listing errors fail the run; an unavailable API is not an absent release.
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > releases.json
          selection="$(python3 image/ubuntu_release.py build/upstream/SHA256SUMS --commit "$COMMIT" "${flags[@]}")"
          printf '%s\n' "$selection" | tee -a "$GITHUB_OUTPUT"
          tag="$(sed -n 's/^tag=//p' <<< "$selection")"
          sums_args=()
          if jq -e --arg tag "$tag" '.[][] | select(.tag_name == $tag and .draft == false)' releases.json >/dev/null; then
            mkdir -p build/published
            gh release download "$tag" --repo "$GH_REPO" --pattern SHA256SUMS --dir build/published
            sums_args=(--published-sums build/published/SHA256SUMS)
          fi
          python3 image/ubuntu_release.py build/upstream/SHA256SUMS --version "$(sed -n 's/^version=//p' <<< "$selection")" \
            --commit "$COMMIT" "${flags[@]}" --published releases.json "${sums_args[@]}" | tee -a "$GITHUB_OUTPUT"
  release:
    needs: discover
    if: needs.discover.outputs.needed == 'true'
    uses: ./.github/workflows/image-release.yml
    permissions:
      contents: write
    with:
      ubuntu_version: ${{ needs.discover.outputs.version }}
      ubuntu_sha256: ${{ needs.discover.outputs.sha256 }}
      release_tag: ${{ needs.discover.outputs.tag }}
      publish: true
