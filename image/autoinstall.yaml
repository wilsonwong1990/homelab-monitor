# Ubuntu 24.04 Desktop autoinstall for a homelab monitoring PC.
# build-iso.sh places this at the ISO root with a pinned git bundle of this
# repository. Disk, account and network remain interactive so the image holds
# no password and cannot silently erase the wrong disk. No secrets belong here.
autoinstall:
  version: 1
  interactive-sections:
    - locale
    - keyboard
    - network
    - storage
    - identity
  source:
    id: ubuntu-desktop-minimal
  codecs:
    install: false
  drivers:
    install: true
  timezone: geoip
  updates: security
  packages:
    - git
    - python3-venv
    - curl
    - sqlite3
    - ca-certificates
  late-commands:
    # Stage the pinned repository; the first boot (with network) runs install.sh.
    - test -f /cdrom/homelab/homelab-monitor.bundle
    - test -f /cdrom/homelab/ref
    - cp /cdrom/homelab/homelab-monitor.bundle /target/root/homelab-monitor.bundle
    - cp /cdrom/homelab/ref /target/root/homelab-ref
    - curtin in-target -- sh -c 'git clone --quiet --no-checkout /root/homelab-monitor.bundle /opt/homelab-monitor-src && git -C /opt/homelab-monitor-src checkout --quiet --detach "$(cat /root/homelab-ref)"'
    # The bundle is deleted below; point origin at upstream so DEPLOY.md upgrades work. Change for forks.
    - curtin in-target -- git -C /opt/homelab-monitor-src remote set-url origin https://github.com/wilsonwong1990/homelab-monitor.git
    - curtin in-target -- chown -R root:root /opt/homelab-monitor-src
    - curtin in-target -- install -m 0644 /opt/homelab-monitor-src/image/homelab-firstboot.service /etc/systemd/system/homelab-firstboot.service
    - curtin in-target -- systemctl enable homelab-firstboot.service
    - curtin in-target -- rm -f /root/homelab-monitor.bundle /root/homelab-ref
